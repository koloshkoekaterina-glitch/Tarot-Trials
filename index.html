<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Інтерактивний Розклад Таро</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Georgia', serif;
      background-color: #0d0b12;
      color: #f3e5ab;
    }

    /* Фон зі столом, свічками та кристалами */
    .bg-table {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('table-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 20, 0.35);
      z-index: 2;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
    }

    header {
      text-align: center;
      background: rgba(15, 10, 25, 0.75);
      padding: 10px 25px;
      border-radius: 15px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
    }
    header h1 {
      font-size: 1.6rem;
      color: #f7d774;
      letter-spacing: 1.5px;
    }
    header p {
      font-size: 0.95rem;
      color: #e0d0b0;
      margin-top: 3px;
    }

    .main-workspace {
      display: flex;
      width: 100%;
      max-width: 1100px;
      margin: 15px 0;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    /* Ліва панель з колодою */
    .deck-panel {
      flex: 0 0 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .deck-box {
      width: 140px;
      height: 220px;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      perspective: 1000px;
    }
    .deck-box:hover {
      transform: translateY(-6px) scale(1.02);
    }
    .deck-cover {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: -8px 12px 25px rgba(0,0,0,0.85), 0 0 15px rgba(212, 175, 55, 0.5);
      border: 2px solid #d4af37;
      object-fit: cover;
    }
    .deck-counter {
      margin-top: 10px;
      background: rgba(0,0,0,0.8);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      border: 1px solid #d4af37;
      color: #f7d774;
    }

    /* Сітка карт 3 в ряд */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 130px);
      grid-template-rows: repeat(2, 215px);
      gap: 15px;
      justify-content: center;
    }

    /* Карта */
    .card-slot {
      width: 130px;
      height: 215px;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }

    .card.drawn {
      opacity: 1;
      pointer-events: auto;
      animation: drawToSlot 0.6s ease-out forwards;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    @keyframes drawToSlot {
      0% {
        opacity: 0;
        transform: translate(-180px, 80px) scale(0.5) rotate(-20deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.85), 0 0 10px rgba(212, 175, 55, 0.4);
      border: 1.5px solid #d4af37;
      overflow: hidden;
    }

    .card-back {
      background-color: #1a1528;
    }

    .card-front {
      transform: rotateY(180deg);
      background-color: #0d0b18;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Футер із кнопкою */
    .footer-panel {
      background: rgba(15, 10, 25, 0.8);
      border: 1px solid #d4af37;
      padding: 10px 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 10px;
    }
    .btn-reset {
      margin-top: 5px;
      padding: 6px 16px;
      background: #d4af37;
      color: #0b0a10;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 700px) {
      .main-workspace {
        flex-direction: column;
      }
      .cards-grid {
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(2, 165px);
        gap: 8px;
      }
      .card-slot {
        width: 100px;
        height: 165px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-table"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">
    <header>
      <h1>Розклад Таро</h1>
      <p id="instruction">Натисніть на коробку з колодою, щоб дістати першу карту</p>
    </header>

    <div class="main-workspace">
      <!-- Коробка колоди -->
      <div class="deck-panel">
        <div class="deck-box" id="deckBox">
          <img src="book-cover.jpg" alt="Колода Таро" class="deck-cover">
        </div>
        <div class="deck-counter">Залишилось: <span id="cardsLeft">6</span>/6</div>
      </div>

      <!-- Поле 3 в ряд (2 ряди = 6 карт) -->
      <div class="cards-grid">
        <div class="card-slot"><div class="card" id="card-0"><div class="card-face card-back"><img src="back-1.jpg"></div><div class="card-face card-front"><img src="tower.jpg"></div></div></div>
        <div class="card-slot"><div class="card" id="card-1"><div class="card-face card-back"><img src="back-2.jpg"></div><div class="card-face card-front"><img src="fortune.jpg"></div></div></div>
        <div class="card-slot"><div class="card" id="card-2"><div class="card-face card-back"><img src="back-3.jpg"></div><div class="card-face card-front"><img src="moon.jpg"></div></div></div>
        <div class="card-slot"><div class="card" id="card-3"><div class="card-face card-back"><img src="back-4.jpg"></div><div class="card-face card-front"><img src="star.jpg"></div></div></div>
        <div class="card-slot"><div class="card" id="card-4"><div class="card-face card-back"><img src="back-5.jpg"></div><div class="card-face card-front"><img src="sun.jpg"></div></div></div>
        <div class="card-slot"><div class="card" id="card-5"><div class="card-face card-back"><img src="back-6.jpg"></div><div class="card-face card-front"><img src="death.jpg"></div></div></div>
      </div>
    </div>

    <div class="footer-panel">
      <div id="statusText">Клацніть на колоду для витягування картки.</div>
      <button class="btn-reset" id="resetBtn" onclick="resetAll()">Почати спочатку</button>
    </div>
  </div>

  <script>
    const cardNames = ['Вежа', 'Колесо Фортуни', 'Місяць', 'Зірка', 'Сонце', 'Смерть'];
    let currentIndex = 0;
    let cardStates = Array(6).fill({ drawn: false, flipped: false });

    const deckBox = document.getElementById('deckBox');
    const instruction = document.getElementById('instruction');
    const statusText = document.getElementById('statusText');
    const cardsLeft = document.getElementById('cardsLeft');
    const resetBtn = document.getElementById('resetBtn');

    deckBox.addEventListener('click', () => {
      if (currentIndex >= 6) {
        statusText.innerText = "Усі 6 карт уже витягнуті!";
        return;
      }

      // Перевіряємо чи попередню карту перевернуто
      if (currentIndex > 0 && !cardStates[currentIndex - 1].flipped) {
        statusText.innerText = "Спочатку переверніть відкриту карту!";
        return;
      }

      const cardEl = document.getElementById(`card-${currentIndex}`);
      cardEl.classList.add('drawn');
      cardStates[currentIndex] = { drawn: true, flipped: false };

      cardsLeft.innerText = 6 - (currentIndex + 1);
      instruction.innerText = "Натисніть на витягнуту карту, щоб перевернути її";
      statusText.innerText = `Витягнуто карту №${currentIndex + 1}.`;
    });

    for (let i = 0; i < 6; i++) {
      const cardEl = document.getElementById(`card-${i}`);
      cardEl.addEventListener('click', () => {
        if (!cardStates[i].drawn || cardStates[i].flipped) return;

        cardEl.classList.add('flipped');
        cardStates[i] = { ...cardStates[i], flipped: true };

        statusText.innerText = `Карта №${i + 1}: ${cardNames[i]}!`;

        if (i === currentIndex) {
          currentIndex++;
        }

        if (currentIndex < 6) {
          instruction.innerText = "Натисніть на колоду, щоб дістати наступну карту";
        } else {
          instruction.innerText = "Усі карти розкладено та відкрито!";
          resetBtn.style.display = 'inline-block';
        }
      });
    }

    function resetAll() {
      currentIndex = 0;
      cardStates = Array(6).fill({ drawn: false, flipped: false });
      for (let i = 0; i < 6; i++) {
        const cardEl = document.getElementById(`card-${i}`);
        cardEl.classList.remove('drawn', 'flipped');
      }
      cardsLeft.innerText = "6";
      instruction.innerText = "Натисніть на коробку з колодою, щоб дістати першу карту";
      statusText.innerText = "Клацніть на колоду для витягування картки.";
      resetBtn.style.display = 'none';
    }
  </script>
</body>
</html>
