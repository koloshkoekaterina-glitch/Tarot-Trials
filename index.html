<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Інтерактивний Розклад Таро</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Georgia', serif;
      background-color: #0d0b12;
      color: #f3e5ab;
    }

    /* Фон зі столом, свічками та кристалами */
    .bg-table {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('taro-table.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* Легке темне перекриття для кращої читабельності */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 20, 0.25);
      z-index: 2;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    header {
      text-align: center;
      background: rgba(15, 10, 25, 0.85);
      padding: 12px 25px;
      border-radius: 15px;
      border: 1px solid rgba(212, 175, 55, 0.6);
      box-shadow: 0 4px 25px rgba(0,0,0,0.9);
      backdrop-filter: blur(5px);
    }
    header h1 {
      font-size: 1.8rem;
      color: #f7d774;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    header p {
      font-size: 1rem;
      color: #e0d0b0;
      margin-top: 5px;
    }

    .main-workspace {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      margin: 20px 0;
      align-items: center;
      gap: 25px;
    }

    /* Коробка з колодою */
    .deck-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .deck-box {
      width: 150px;
      height: 235px;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      perspective: 1000px;
    }
    .deck-box:hover {
      transform: translateY(-8px) scale(1.03);
    }
    .deck-cover {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.6);
      border: 2px solid #d4af37;
      object-fit: cover;
    }
    .deck-counter {
      margin-top: 10px;
      background: rgba(0,0,0,0.85);
      padding: 5px 15px;
      border-radius: 12px;
      font-size: 0.9rem;
      border: 1px solid #d4af37;
      color: #f7d774;
    }

    /* Сітка карт строго 3 в ряд */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      grid-template-rows: repeat(2, 265px);
      gap: 20px;
      justify-content: center;
      width: 100%;
    }

    /* Окремий слот під карту */
    .card-slot {
      width: 160px;
      height: 265px;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }

    .card.drawn {
      opacity: 1;
      pointer-events: auto;
      animation: drawToSlot 0.6s ease-out forwards;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    @keyframes drawToSlot {
      0% {
        opacity: 0;
        transform: translateY(-120px) scale(0.5) rotate(-15deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.9), 0 0 12px rgba(212, 175, 55, 0.4);
      border: 2px solid #d4af37;
      overflow: hidden;
    }

    .card-back {
      background-color: #1a1528;
    }

    .card-front {
      transform: rotateY(180deg);
      background-color: #0d0b18;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Нижнє поле статусу */
    .footer-panel {
      background: rgba(15, 10, 25, 0.85);
      border: 1px solid #d4af37;
      padding: 12px 25px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 10px;
      backdrop-filter: blur(4px);
    }
    .btn-reset {
      margin-top: 8px;
      padding: 8px 20px;
      background: #d4af37;
      color: #0b0a10;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: none;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-reset:hover {
      background: #f7d774;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .cards-grid {
        grid-template-columns: repeat(3, 105px);
        grid-template-rows: repeat(2, 175px);
        gap: 10px;
      }
      .card-slot {
        width: 105px;
        height: 175px;
      }
      .deck-box {
        width: 120px;
        height: 190px;
      }
    }
  </style>
</head>
<body>

  <!-- Фон зі свічками та столом -->
  <div class="bg-table"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">
    <header>
      <h1>Таємний Розклад Таро</h1>
      <p id="instruction">Натисніть на коробку з колодою, щоб дістати першу карту</p>
    </header>

    <div class="main-workspace">
      <!-- Коробка колоди -->
      <div class="deck-panel">
        <div class="deck-box" id="deckBox">
          <img src="book-cover.jpg" alt="Обкладинка Колоди Таро" class="deck-cover">
        </div>
        <div class="deck-counter">Залишилось карт: <span id="cardsLeft">6</span>/6</div>
      </div>

      <!-- Сітка строго 3 в ряд (2 ряди x 3 колонки = 6 карт) -->
      <div class="cards-grid">
        <!-- Ряд 1 -->
        <div class="card-slot"><div class="card" id="card-0"><div class="card-face card-back"><img src="back-1.jpg" alt="Сорочка 1"></div><div class="card-face card-front"><img src="tower.jpg" alt="Вежа"></div></div></div>
        <div class="card-slot"><div class="card" id="card-1"><div class="card-face card-back"><img src="back-2.jpg" alt="Сорочка 2"></div><div class="card-face card-front"><img src="fortune.jpg" alt="Колесо Фортуни"></div></div></div>
        <div class="card-slot"><div class="card" id="card-2"><div class="card-face card-back"><img src="back-3.jpg" alt="Сорочка 3"></div><div class="card-face card-front"><img src="moon.jpg" alt="Місяць"></div></div></div>
        <!-- Ряд 2 -->
        <div class="card-slot"><div class="card" id="card-3"><div class="card-face card-back"><img src="back-4.jpg" alt="Сорочка 4"></div><div class="card-face card-front"><img src="star.jpg" alt="Зірка"></div></div></div>
        <div class="card-slot"><div class="card" id="card-4"><div class="card-face card-back"><img src="back-5.jpg" alt="Сорочка 5"></div><div class="card-face card-front"><img src="sun.jpg" alt="Сонце"></div></div></div>
        <div class="card-slot"><div class="card" id="card-5"><div class="card-face card-back"><img src="back-6.jpg" alt="Сорочка 6"></div><div class="card-face card-front"><img src="death.jpg" alt="Смерть"></div></div></div>
      </div>
    </div>

    <div class="footer-panel">
      <div id="statusText">Клацніть на колоду для витягування першої карти.</div>
      <button class="btn-reset" id="resetBtn" onclick="resetAll()">Почати розклад спочатку</button>
    </div>
  </div>

  <script>
    const cardNames = ['Вежа', 'Колесо Фортуни', 'Місяць', 'Зірка', 'Сонце', 'Смерть'];
    let currentIndex = 0;
    let cardStates = Array(6).fill({ drawn: false, flipped: false });

    const deckBox = document.getElementById('deckBox');
    const instruction = document.getElementById('instruction');
    const statusText = document.getElementById('statusText');
    const cardsLeft = document.getElementById('cardsLeft');
    const resetBtn = document.getElementById('resetBtn');

    // Клік на колоду
    deckBox.addEventListener('click', () => {
      if (currentIndex >= 6) {
        statusText.innerText = "Усі 6 карт вже витягнуті та розкладені 3 в ряд!";
        return;
      }

      // Не дозволяємо витягати наступну, поки поточна не перевернута
      if (currentIndex > 0 && !cardStates[currentIndex - 1].flipped) {
        statusText.innerText = "Спочатку переверніть поточну карту, натиснувши на неї!";
        return;
      }

      const cardEl = document.getElementById(`card-${currentIndex}`);
      cardEl.classList.add('drawn');
      cardStates[currentIndex] = { drawn: true, flipped: false };

      cardsLeft.innerText = 6 - (currentIndex + 1);
      instruction.innerText = "Натисніть на витягнуту карту, щоб перевернути її";
      statusText.innerText = `Витягнуто карту №${currentIndex + 1}. Натисніть на неї!`;
    });

    // Налаштування кліків по картах для перевертання
    for (let i = 0; i < 6; i++) {
      const cardEl = document.getElementById(`card-${i}`);
      cardEl.addEventListener('click', () => {
        if (!cardStates[i].drawn || cardStates[i].flipped) return;

        cardEl.classList.add('flipped');
        cardStates[i] = { ...cardStates[i], flipped: true };

        statusText.innerText = `Відкрито карту №${i + 1}: ${cardNames[i]}!`;

        if (i === currentIndex) {
          currentIndex++;
        }

        if (currentIndex < 6) {
          instruction.innerText = "Натисніть на колоду, щоб дістати наступну карту";
        } else {
          instruction.innerText = "Усі 6 карт розкладено та відкрито!";
          resetBtn.style.display = 'inline-block';
        }
      });
    }

    // Скидання розкладу
    function resetAll() {
      currentIndex = 0;
      cardStates = Array(6).fill({ drawn: false, flipped: false });
      for (let i = 0; i < 6; i++) {
        const cardEl = document.getElementById(`card-${i}`);
        cardEl.classList.remove('drawn', 'flipped');
      }
      cardsLeft.innerText = "6";
      instruction.innerText = "Натисніть на коробку з колодою, щоб дістати першу карту";
      statusText.innerText = "Клацніть на колоду для витягування першої карти.";
      resetBtn.style.display = 'none';
    }
  </script>
</body>
</html>
